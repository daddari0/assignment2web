  <h1>Task 1: Geometric Composition (CSS Grid)</h1>
  <p class="subtitle">Single 6x6 CSS Grid &bull; Stays square &bull; Black lines from grid gap &bull; No media queries</p>

  <!-- 6x6 CSS Grid Composition -->
  <div class="grid-container">
    <div class="block blue"></div>
    <div class="block white-top"></div>
    <div class="block yellow"></div>
    <div class="block white-mid"></div>
    <div class="block red"></div>
    <div class="block black-block"></div>
    <div class="block white-bottom"></div>
  </div>
